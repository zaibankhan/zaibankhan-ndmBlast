<HTML>
<head>
<title>NDM BLAST Tool</title>
<style>
  /* 3D hover effect with glow */
  .nav-btn {
    background-color: purple;
    color: white;
    padding: 10px 25px;
    font-size: 18px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    transform: perspective(600px) translateZ(0);
    box-shadow: 0 6px 0 #4a004a, 0 8px 10px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    top: 0;
  }
  .nav-btn:hover {
    transform: perspective(600px) translateZ(18px) translateY(-4px);
    box-shadow: 0 12px 0 #4a004a,
                0 16px 20px rgba(0,0,0,0.35),
                0 0 18px 6px rgba(180,0,255,0.45),
                0 18px 30px rgba(180,0,255,0.25);
  }
  .nav-btn:active {
    transform: perspective(600px) translateZ(4px) translateY(2px);
    box-shadow: 0 2px 0 #4a004a,
                0 4px 6px rgba(0,0,0,0.2),
                0 0 8px 3px rgba(180,0,255,0.3);
  }
  .btn-3d {
    color: white;
    padding: 8px 20px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transform: perspective(600px) translateZ(0);
    box-shadow: 0 6px 0 var(--btn-shadow, #333), 0 8px 10px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    top: 0;
  }
  .btn-3d:hover {
    transform: perspective(600px) translateZ(18px) translateY(-4px);
    box-shadow: 0 12px 0 var(--btn-shadow, #333),
                0 16px 20px rgba(0,0,0,0.35),
                0 0 18px 6px var(--btn-glow, rgba(255,255,255,0.4)),
                0 18px 30px var(--btn-glow, rgba(255,255,255,0.25));
  }
  .btn-3d:active {
    transform: perspective(600px) translateZ(4px) translateY(2px);
    box-shadow: 0 2px 0 var(--btn-shadow, #333),
                0 4px 6px rgba(0,0,0,0.2),
                0 0 8px 3px var(--btn-glow, rgba(255,255,255,0.3));
  }
</style>
</head>
<body style="background-color:#9B59B6; height:100vh; margin:0;">
<button id="shareBtn" onclick="shareThisPage()" class="btn-3d" style="position:fixed; top:15px; right:20px; background-color:#2c6e49; z-index:1000; --btn-shadow:#184a30; --btn-glow:rgba(46,204,113,0.55);">
  🔗 Share
</button>
<script>
function shareThisPage() {
  var url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: document.title, url: url }).catch(function(){});
  } else {
    navigator.clipboard.writeText(url).then(function() {
      var btn = document.getElementById("shareBtn");
      var original = btn.innerHTML;
      btn.innerHTML = "✅ Link Copied!";
      setTimeout(function(){ btn.innerHTML = original; }, 1800);
    });
  }
}
</script>

<hr style="border:2px solid white;">
