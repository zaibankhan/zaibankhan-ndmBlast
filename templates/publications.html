<html>
<head>
<title>{{ variant_id }} — Publications</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #6BAED6;
    padding: 20px 40px;
  }
  .pub-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .pub-link {
    display: block;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 12px 16px;
    text-decoration: none;
    color: #1565c0;
    word-break: break-all;
    font-size: 14px;
  }
  .pub-link:hover { background: #f0f0f0; }
</style>
</head>
<body>

<h1>{{ variant_id }} — Publication Database</h1>
<p>Total publications found: {{ links|length }}</p>
<hr>

{% if links %}
<div class="pub-grid">
  {% for link in links %}
  <a class="pub-link" href="{{ link }}" target="_blank">{{ link }}</a>
  {% endfor %}
</div>
{% else %}
  <p>No publication links available for this variant.</p>
{% endif %}

</body>
</html>
